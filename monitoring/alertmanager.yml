global:
  resolve_timeout: 5m
  smtp_require_tls: false

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default
  routes:
    - match:
        severity: critical
      receiver: critical
      continue: true

receivers:
  - name: default
    # Uncomment and configure when you want real notifications:
    # email_configs:
    #   - to: admin@example.com
    #     from: alerts@example.com
    #     smarthost: mail.example.com:587
    #     auth_username: alerts@example.com
    #     auth_password: YOUR_PASSWORD

  - name: critical
    # webhook_configs:
    #   - url: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"
    #     send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname']
