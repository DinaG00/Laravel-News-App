services:
  grafana:
    image: grafana/grafana:11.3.0
    container_name: prime-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - prime-grafana:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - monitoring
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:3.5.0
    container_name: prime-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - prime-loki:/tmp/loki
      - ./monitoring/loki-config.yaml:/etc/loki/loki-config.yaml
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: prime-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=5d"
    volumes:
      - prime-prometheus:/prometheus
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - monitoring

  alloy:
    image: grafana/alloy:v1.5.1
    container_name: prime-alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    ports:
      - "12345:12345"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./monitoring/config.alloy:/etc/alloy/config.alloy
    networks:
      - monitoring

  # Optional: Node exporter for host metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: prime-node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring

networks:
  monitoring:
    name: monitoring
    external: true

volumes:
  prime-grafana:
    driver: local
  prime-loki:
    driver: local
  prime-prometheus:
    driver: local
